[project]
name = "app-tracker-backend"
version = "0.1.0"
description = "Application Tracker backend: Gmail sync, email extraction, applications API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "supabase>=2.8",
    "google-auth>=2.32",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
    "openai>=1.50",
    "apscheduler>=3.10",
    "python-jose[cryptography]>=3.3",
    "cryptography>=43.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
